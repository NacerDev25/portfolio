<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عني | About Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- الهيدر المشترك -->
  <header class="site-header" id="site-header">
    <div class="header-container">
      <div class="header-left">
        <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="فتح القائمة الجانبية">
          <span class="menu-toggle-bar"></span>
          <span class="menu-toggle-bar"></span>
          <span class="menu-toggle-bar"></span>
        </button>
        <a class="site-logo" href="index.html" aria-label="الذهاب للصفحة الرئيسية">Logo</a>
      </div>
      <nav class="nav-desktop" aria-label="التنقل الرئيسي">
        <ul class="nav-desktop-list">
          <li class="nav-desktop-item">
            <a class="nav-desktop-link is-active" href="index.html" data-page="index">عني</a>
          </li>
          <li class="nav-desktop-item">
            <a class="nav-desktop-link" href="projects.html" data-page="projects">المشاريع</a>
          </li>
          <li class="nav-desktop-item">
            <a class="nav-desktop-link" href="services.html" data-page="services">الخدمات</a>
          </li>
          <li class="nav-desktop-item">
            <a class="nav-desktop-link" href="contact.html" data-page="contact">التواصل</a>
          </li>
        </ul>
      </nav>
      <div class="header-actions">
        <div class="settings-dropdown" id="settings-dropdown">
          <button class="settings-toggle" id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel" aria-haspopup="true">
            الإعدادات
          </button>
          <div class="settings-panel" id="settings-panel" role="menu" aria-labelledby="settings-toggle">
            <div class="settings-panel-section">
              <span class="settings-panel-label">المظهر</span>
              <div class="theme-toggle-group" role="group" aria-label="تغيير المظهر">
                <button class="theme-option is-active" type="button" data-theme="light">الوضع الفاتح</button>
                <button class="theme-option" type="button" data-theme="dark">الوضع الداكن</button>
              </div>
            </div>
            <div class="settings-panel-section">
              <label class="settings-panel-label" for="language-select-header">اللغة</label>
              <select class="language-select" id="language-select-header" aria-label="اختيار اللغة">
                <option value="en" selected>English</option>
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- القائمة الجانبية (تظهر فقط على الشاشات الصغيرة) -->
  <aside class="sidebar" id="sidebar" aria-hidden="true">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="sidebar-panel" role="dialog" aria-modal="true" aria-labelledby="sidebar-title">
      <div class="sidebar-header">
        <span class="sidebar-title" id="sidebar-title">القائمة</span>
        <button class="sidebar-close" id="sidebar-close" type="button" aria-label="إغلاق القائمة">×</button>
      </div>
      <nav class="sidebar-nav" aria-label="التنقل الرئيسي">
        <ul class="nav-list">
          <li class="nav-item">
            <a class="nav-link is-active" href="index.html" data-page="index">عني</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="projects.html" data-page="projects">المشاريع</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="services.html" data-page="services">الخدمات</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contact.html" data-page="contact">التواصل</a>
          </li>
        </ul>
      </nav>
      <section class="sidebar-settings" aria-label="إعدادات الموقع">
        <h2 class="settings-title">الإعدادات</h2>
        <div class="settings-group">
          <span class="settings-label">المظهر</span>
          <div class="theme-toggle-group" role="group" aria-label="تغيير المظهر">
            <button class="theme-option is-active" type="button" data-theme="light">الوضع الفاتح</button>
            <button class="theme-option" type="button" data-theme="dark">الوضع الداكن</button>
          </div>
        </div>
        <div class="settings-group">
          <label class="settings-label" for="language-select">اللغة</label>
          <select class="language-select" id="language-select" aria-label="اختيار اللغة">
            <option value="en" selected>English</option>
            <option value="ar">العربية</option>
            <option value="fr">Français</option>
          </select>
        </div>
      </section>
    </div>
  </aside>

  <!-- المحتوى الرئيسي -->
  <main class="main-content">
    <section class="about-section" aria-labelledby="about-title">
      <div class="container">
        <header class="about-header">
          <h1 class="about-title" id="about-title">عني</h1>
          <p class="about-subtitle">مطور ويب | معرض الأعمال</p>
        </header>
        <div class="about-body">
          <!-- هيكل فقط، سيُعبأ لاحقًا حسب الأمر -->
        </div>
      </div>
    </section>
  </main>

  <!-- الفوتر المشترك -->
  <footer class="site-footer" id="site-footer">
    <div class="footer-container">
      <p class="footer-copy">© 2026 اسمك. جميع الحقوق محفوظة.</p>
    </div>
  </footer>

  <script src="js.js" defer></script>
</body>

</html>
